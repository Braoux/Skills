name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill metadata and Markdown docs
        run: python3 scripts/validate_skills.py
      - name: Test no-key growth skill contracts
        run: python3 scripts/test_zero_key_growth_skills.py
